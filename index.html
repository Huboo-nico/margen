<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        function isBenignViteWsError(err) {
          if (!err) return false;
          var msg = (err.message || String(err) || '').toLowerCase();
          var reason = (err.reason && (err.reason.message || String(err.reason)) || '').toLowerCase();
          return msg.includes('websocket closed without opened') ||
                 reason.includes('websocket closed without opened') ||
                 msg.includes('failed to connect to websocket') ||
                 reason.includes('failed to connect to websocket');
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isBenignViteWsError(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isBenignViteWsError(event.error) || isBenignViteWsError(event.message)) {
            event.preventDefault();
            event.stopPropagation();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Ignore if already configured
        }
      })();
    </script>
    <title>MVP Rentabilidad Fulfilment</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="description" content="Calculadora operativa para cotizar y analizar márgenes de fulfilment por cliente, preparación, picks, embalaje, envío y almacenaje." />
    <meta property="og:title" content="MVP Rentabilidad Fulfilment" />
    <meta property="og:description" content="Calculadora operativa para cotizar y analizar márgenes de fulfilment por cliente, preparación, picks, embalaje, envío y almacenaje." />
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
